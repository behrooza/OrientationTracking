[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transform"
version = "0.0.1"
authors = [
  { name="behrooz", email="azadi.bhrz@gmail.com" },
]
description = "Quaternion-based orientation tracking: transforms IMU (accelerometer, gyroscope, magnetometer) data from the sensor frame to the world frame"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "pandas",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/behrooza/OrientationTracking.git"